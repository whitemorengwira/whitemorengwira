<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">How I direct AI-assisted software engineering</title><desc id="desc">Scope, implement, debug, test, review and hand over. Claude Code and Codex support the work; Whitemore directs decisions and checks evidence. Illustrative workflow, not an internal system diagram.</desc><rect width="1200" height="520" rx="18" fill="#091324"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="49" fill="#E3C889" font-size="16" letter-spacing="2">CLAUDE CODE + CODEX / HUMAN-DIRECTED ENGINEERING</text><text x="40" y="93" font-size="28" fill="#F5F1E7" font-weight="700">From a clear problem to a reviewable change</text><rect x="40" y="125" width="350" height="145" rx="10" fill="#12263A" stroke="#34495B"/><text x="60" y="156" fill="#E3C889" font-size="14">01</text><text x="60" y="186" fill="#F5F1E7" font-size="22" font-weight="700">Scope &amp; understand</text><text x="60" y="219" fill="#BCCAD7" font-size="16">Define the problem, inspect context,</text><text x="60" y="242" fill="#BCCAD7" font-size="16">set boundaries and acceptance criteria.</text><rect x="415" y="125" width="350" height="145" rx="10" fill="#12263A" stroke="#34495B"/><text x="435" y="156" fill="#E3C889" font-size="14">02</text><text x="435" y="186" fill="#F5F1E7" font-size="22" font-weight="700">Design &amp; implement</text><text x="435" y="219" fill="#BCCAD7" font-size="16">Compare approaches, build focused</text><text x="435" y="242" fill="#BCCAD7" font-size="16">changes and review the resulting diff.</text><rect x="790" y="125" width="350" height="145" rx="10" fill="#12263A" stroke="#34495B"/><text x="810" y="156" fill="#E3C889" font-size="14">03</text><text x="810" y="186" fill="#F5F1E7" font-size="22" font-weight="700">Debug &amp; investigate</text><text x="810" y="219" fill="#BCCAD7" font-size="16">Reproduce faults, examine evidence</text><text x="810" y="242" fill="#BCCAD7" font-size="16">and work through competing causes.</text><rect x="40" y="291" width="350" height="145" rx="10" fill="#12263A" stroke="#34495B"/><text x="60" y="322" fill="#E3C889" font-size="14">04</text><text x="60" y="352" fill="#F5F1E7" font-size="22" font-weight="700">Test &amp; verify</text><text x="60" y="385" fill="#BCCAD7" font-size="16">Run appropriate checks; separate</text><text x="60" y="408" fill="#BCCAD7" font-size="16">test evidence from assumptions.</text><rect x="415" y="291" width="350" height="145" rx="10" fill="#12263A" stroke="#34495B"/><text x="435" y="322" fill="#E3C889" font-size="14">05</text><text x="435" y="352" fill="#F5F1E7" font-size="22" font-weight="700">Review &amp; refine</text><text x="435" y="385" fill="#BCCAD7" font-size="16">Challenge the change, address gaps</text><text x="435" y="408" fill="#BCCAD7" font-size="16">and check confidentiality boundaries.</text><rect x="790" y="291" width="350" height="145" rx="10" fill="#12263A" stroke="#34495B"/><text x="810" y="322" fill="#E3C889" font-size="14">06</text><text x="810" y="352" fill="#F5F1E7" font-size="22" font-weight="700">Document &amp; hand over</text><text x="810" y="385" fill="#BCCAD7" font-size="16">Explain what changed, validation,</text><text x="810" y="408" fill="#BCCAD7" font-size="16">remaining limits and the next step.</text><text x="40" y="480" fill="#E3C889" font-size="17">I own the decisions. Tool output is checked against code, tests and observable behaviour.</text></g></svg>
